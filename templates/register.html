{% extends 'base.html' %}

{% block title %}Регистрация — База Отдыха{% endblock %}

{% block content %}
<section class="section container">
    <div class="auth-form">
        <h1>Регистрация</h1>
        <form method="post" novalidate id="register-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="form-error">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
        </form>
        <p class="auth-link">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </div>
</section>
{% endblock %}
